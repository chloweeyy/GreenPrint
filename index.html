<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>GreenPrint — Welcome to KGG Garden</title>
<!-- Favicon uses the JPG -->
<link rel="icon" type="image/jpeg" href="IMAGE/logo.jpg">
<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  @layer base{html,body{margin:0;padding:0;}}
  body {
    background: radial-gradient(1400px 800px at 50% -10%, rgba(127,167,135,.2), transparent), #f9faf6;
  }
  html, body {
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .kiosk-card {
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    text-decoration: none;
    position: relative;
  }
  .kiosk-card:active {
    transform: scale(0.96);
  }
</style>
</head>
<body class="font-body-md text-on-background flex flex-col items-center justify-center min-h-screen relative py-12 md:py-0">

  <!-- Brand Logo & Header Prompt -->
  <div class="mb-8 md:mb-10 flex flex-col items-center gap-3">
    <div class="w-full max-w-[280px] md:max-w-[420px] flex items-center justify-center px-4">
      <img src="IMAGE/logo.png" alt="GreenPrint Logo" class="w-full h-auto object-contain" style="mix-blend-mode: multiply;">
    </div>
    <div class="text-center mt-2 px-4">
      <h1 class="font-headline-lg text-3xl md:text-[48px] text-primary leading-tight">What would you like to do?</h1>
    </div>
  </div>

  <!-- Giant Touch Grid Options -->
  <div class="flex flex-col md:flex-row gap-4 md:gap-6 w-full max-w-[1200px] justify-center px-4 md:px-8 pb-8">
    
    <!-- Option 1: Checkout (Direct Link to POS) -->
    <a href="pos.html" class="kiosk-card flex-1 bg-white border-2 border-outline-variant/30 rounded-[32px] p-8 md:p-12 flex flex-col items-center text-center shadow-lg hover:shadow-2xl hover:border-secondary group relative overflow-hidden">
      <div class="h-24 w-24 md:h-36 md:w-36 bg-surface-container text-secondary rounded-full flex items-center justify-center mb-6 md:mb-8 group-hover:scale-110 group-hover:bg-secondary-container group-hover:text-on-secondary-container transition-all duration-300">
        <span class="material-symbols-outlined text-[48px] md:text-[72px]">point_of_sale</span>
      </div>
      <h2 class="font-headline-md text-2xl md:text-3xl text-primary mb-2 md:mb-3">Shop & Checkout</h2>
      <p class="text-on-surface-variant text-sm md:text-lg leading-relaxed">Process POS transactions and update live stock records.</p>
    </a>

    <!-- Option 2: AI Identify -->
    <a href="Plant_Upload.html" class="kiosk-card flex-1 bg-white border-2 border-outline-variant/30 rounded-[32px] p-8 md:p-12 flex flex-col items-center text-center shadow-lg hover:shadow-2xl hover:border-secondary group">
      <div class="h-24 w-24 md:h-36 md:w-36 bg-surface-container text-secondary rounded-full flex items-center justify-center mb-6 md:mb-8 group-hover:scale-110 group-hover:bg-secondary-container group-hover:text-on-secondary-container transition-all duration-300">
        <span class="material-symbols-outlined text-[48px] md:text-[72px]">photo_camera</span>
      </div>
      <h2 class="font-headline-md text-2xl md:text-3xl text-primary mb-2 md:mb-3">Identify Plant (AI)</h2>
      <p class="text-on-surface-variant text-sm md:text-lg leading-relaxed">Use our smart camera to scan and identify any plant.</p>
    </a>

    <!-- Option 3: Garden Visualizer -->
    <a href="Garden_Visualizer.html" class="kiosk-card flex-1 bg-white border-2 border-outline-variant/30 rounded-[32px] p-8 md:p-12 flex flex-col items-center text-center shadow-lg hover:shadow-2xl hover:border-secondary group">
      <div class="h-24 w-24 md:h-36 md:w-36 bg-surface-container text-secondary rounded-full flex items-center justify-center mb-6 md:mb-8 group-hover:scale-110 group-hover:bg-secondary-container group-hover:text-on-secondary-container transition-all duration-300">
        <span class="material-symbols-outlined text-[48px] md:text-[72px]">yard</span>
      </div>
      <h2 class="font-headline-md text-2xl md:text-3xl text-primary mb-2 md:mb-3">Garden Visualizer</h2>
      <p class="text-on-surface-variant text-sm md:text-lg leading-relaxed">Design and preview your dream layout before buying.</p>
    </a>

  </div>

</body>
</html>
