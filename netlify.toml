[build]
  command = "node build-netlify.mjs"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/pump-command"
  to = "/.netlify/functions/pump-command"
  status = 200
  force = true

[[redirects]]
  from = "/*.php"
  to = "/404.html"
  status = 404
  force = true
